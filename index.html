<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
  <title>Ciak</title>
  <meta name="description" content="Scrivi sceneggiature nel formato standard, annota idee e scene e costruisci il flow chart della storia.">
  <meta name="theme-color" content="#faf9f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ciak">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/courier-prime-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css">
  <style id="page-size-style"></style>
</head>
<body data-view="script">
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn script-only" id="btn-sidebar" type="button" title="Scene e personaggi" aria-label="Scene e personaggi">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span>
      </button>
      <button class="proj-title" id="btn-projects" type="button" title="I tuoi copioni">
        <span class="logo" aria-hidden="true"></span>
        <span id="proj-title">Ciak</span>
        <span class="caret" aria-hidden="true">▾</span>
      </button>
    </div>
    <nav class="tabs seg" role="tablist" aria-label="Sezioni">
      <button type="button" role="tab" data-view="script">Copione</button>
      <button type="button" role="tab" data-view="ideas"><span class="long">Idee &amp; Scene</span><span class="short">Idee</span></button>
      <button type="button" role="tab" data-view="flow"><span class="long">Flow chart</span><span class="short">Flow</span></button>
    </nav>
    <div class="header-right">
      <span class="save-state" id="save-state" aria-live="polite">Salvato</span>
      <button class="icon-btn script-only desktop-only" type="button" data-act="undo" title="Annulla (⌘Z)" aria-label="Annulla">
        <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>
      </button>
      <button class="icon-btn script-only desktop-only" type="button" data-act="redo" title="Ripeti (⇧⌘Z)" aria-label="Ripeti">
        <span class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></span>
      </button>
      <button class="btn desktop-only" id="btn-export" type="button">Esporta</button>
      <button class="icon-btn" id="btn-menu" type="button" title="Menu" aria-label="Menu">
        <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></span>
      </button>
    </div>
  </header>

  <main>
    <!-- COPIONE -->
    <section id="view-script" class="view">
      <aside id="sidebar" class="sidebar" aria-label="Scene e personaggi">
        <div class="side-head">
          <button class="side-title" id="side-title" type="button" title="Modifica il frontespizio">Ciak</button>
          <div class="seg side-tabs">
            <button type="button" class="on" data-tab="scenes">Scene</button>
            <button type="button" data-tab="chars">Personaggi</button>
          </div>
        </div>
        <div class="side-body">
          <ol class="scene-list" id="scene-list"></ol>
          <ul class="char-list" id="char-list" hidden></ul>
        </div>
        <div class="side-foot">
          <div class="side-stats" id="side-stats"></div>
          <div class="side-links">
            <button type="button" class="link-btn" id="btn-help">Guida e scorciatoie</button>
            <button type="button" class="link-btn" data-open="install">Installa l'app</button>
          </div>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <div class="script-main">
        <div id="elbar" class="elbar" aria-label="Tipo di elemento"></div>
        <div class="paper-wrap">
          <div class="paper" id="paper">
            <div class="page" id="page"></div>
          </div>
        </div>
        <div class="statusbar" id="statusbar">
          <div class="hint" id="hint"></div>
          <div class="stats" id="stats"></div>
        </div>
      </div>
    </section>

    <!-- IDEE & SCENE -->
    <section id="view-ideas" class="view" hidden>
      <div class="view-toolbar">
        <div class="search">
          <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
          <input type="search" id="ideas-search" placeholder="Cerca nelle schede" aria-label="Cerca nelle schede">
        </div>
        <div class="toolbar-spacer"></div>
        <button type="button" class="btn" id="ideas-import" title="Crea una scheda per ogni scena già scritta nel copione">Importa scene dal copione</button>
        <button type="button" class="btn primary" id="ideas-add">+ Nuova idea</button>
      </div>
      <div class="board" id="board"></div>
    </section>

    <!-- FLOW CHART -->
    <section id="view-flow" class="view" hidden>
      <div class="view-toolbar flow-toolbar">
        <button type="button" class="btn primary" data-flow="add-scene">+ Scena</button>
        <button type="button" class="btn" data-flow="add-idea">+ Idea</button>
        <span class="tb-sep"></span>
        <button type="button" class="btn" data-flow="import" title="Crea una scheda per ogni scena già scritta nel copione"><span class="long">Importa dal copione</span><span class="short">Importa</span></button>
        <button type="button" class="btn" data-flow="layout" title="Riordina automaticamente il diagramma">Disponi</button>
        <label class="check"><input type="checkbox" id="flow-only-scenes"> Solo scene</label>
      </div>
      <div class="flow-canvas" id="flow-canvas">
        <div class="flow-world" id="flow-world">
          <div class="flow-nodes" id="flow-nodes"></div>
          <div class="flow-labels" id="flow-labels"></div>
        </div>
        <div class="flow-empty" id="flow-empty" hidden>
          <h2>Costruisci la struttura della storia</h2>
          <p>Aggiungi scene e idee, poi collegale trascinando il pallino sotto ogni scheda. Se hai già scritto delle scene, importale dal copione.</p>
          <div class="row center">
            <button type="button" class="btn" data-flow="import">Importa dal copione</button>
            <button type="button" class="btn primary" data-flow="add-scene">+ Prima scena</button>
          </div>
        </div>
        <div class="flow-zoom" aria-label="Zoom">
          <button type="button" class="icon-btn" data-flow="zoom-out" title="Riduci" aria-label="Riduci">−</button>
          <span id="flow-zoom-val">100%</span>
          <button type="button" class="icon-btn" data-flow="zoom-in" title="Ingrandisci" aria-label="Ingrandisci">+</button>
          <button type="button" class="icon-btn" data-flow="fit" title="Adatta allo schermo" aria-label="Adatta allo schermo">
            <span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></span>
          </button>
        </div>
        <div class="flow-selbar" id="flow-selbar" hidden></div>
      </div>
    </section>
  </main>

  <div id="print-root" aria-hidden="true"></div>

  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/sortable.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/ideas.js"></script>
  <script src="js/flow.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
